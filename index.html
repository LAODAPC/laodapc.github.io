<!-- DeepSeek AI助手部分 -->
<section id="deepseek-chat" class="section">
    <h2 class="section-title">AI助手问答</h2>
    <div style="text-align: center; margin-bottom: 20px;">
        <p>有问题想问？让DeepSeek AI助手帮你解答！可以咨询电脑配置、软件使用、科技问题等。</p>
    </div>
    
    <div style="max-width: 800px; margin: 0 auto;">
        <!-- 聊天容器 -->
        <div id="chat-container" style="background: white; border-radius: 10px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: 500px; display: flex; flex-direction: column;">
            <!-- 消息区域 -->
            <div id="chat-messages" style="flex: 1; overflow-y: auto; margin-bottom: 20px; padding: 10px; border: 1px solid #eee; border-radius: 5px;">
                <div class="message ai-message" style="background: #f0f7ff; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 80%;">
                    <strong>AI助手：</strong>你好！我是DeepSeek AI助手，可以帮你解答电脑配置、软件使用、科技问题等。有什么可以帮你的吗？
                </div>
            </div>
            
            <!-- 输入区域 -->
            <div style="display: flex; gap: 10px;">
                <input type="text" id="chat-input" placeholder="输入你的问题..." style="flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 25px; font-size: 16px; outline: none; transition: border-color 0.3s;">
                <button id="send-button" style="background: var(--gradient); color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: 600; transition: transform 0.3s;">
                    发送
                </button>
                <button id="clear-chat" style="background: #f5f5f5; color: #666; border: none; padding: 12px 15px; border-radius: 25px; cursor: pointer; font-weight: 600; transition: all 0.3s;">
                    清空
                </button>
            </div>
            
            <!-- API状态 -->
            <div style="text-align: center; margin-top: 15px; font-size: 12px; color: #777;">
                <span id="api-status-indicator">● 准备就绪</span>
                <span style="margin: 0 10px;">|</span>
                <span id="token-count">Tokens: 0</span>
            </div>
        </div>
        
        <!-- 使用说明 -->
        <div style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; font-size: 14px; color: #666;">
            <h4 style="margin-bottom: 10px; color: var(--primary);">使用说明：</h4>
            <ul style="list-style: none; padding-left: 0;">
                <li style="margin-bottom: 5px;">• 可以咨询电脑硬件配置、软件安装、系统优化等问题</li>
                <li style="margin-bottom: 5px;">• 支持长对话，上下文会保留</li>
                <li style="margin-bottom: 5px;">• 点击"清空"按钮可以开始新的对话</li>
                <li>• 响应可能需要几秒钟时间，请耐心等待</li>
            </ul>
        </div>
    </div>
</section>

<script>
// DeepSeek AI助手功能
document.addEventListener('DOMContentLoaded', function() {
    // DeepSeek API配置 - 已使用你的API密钥
    const DEEPSEEK_API_KEY = 'sk-ac79218c268f4944815b82fd5da2429c';
    const API_URL = 'https://api.deepseek.com/v1/chat/completions';
    
    let conversationHistory = [
        {
            role: "system",
            content: "你是一个专业的电脑科技助手，名叫'牢大说电脑AI助手'。你帮助用户解答电脑配置、硬件选购、软件使用、系统优化、游戏运行等问题。回答要专业、详细、实用，语气友好热情。如果用户询问关于'牢大说电脑'的内容，你可以介绍这是一个科技博主，分享电脑知识和资源。"
        }
    ];
    
    // 获取DOM元素
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const clearButton = document.getElementById('clear-chat');
    const chatMessages = document.getElementById('chat-messages');
    const apiStatus = document.getElementById('api-status-indicator');
    const tokenCount = document.getElementById('token-count');
    
    // 发送消息函数
    async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;
        
        // 添加用户消息到界面
        addMessageToChat('user', message);
        chatInput.value = '';
        
        // 添加到历史记录
        conversationHistory.push({ role: "user", content: message });
        
        // 显示加载状态
        showLoading(true);
        apiStatus.textContent = '● 思考中...';
        apiStatus.style.color = '#FF9800';
        
        try {
            // 调用DeepSeek API
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: conversationHistory,
                    temperature: 0.7,
                    max_tokens: 2000
                })
            });
            
            if (!response.ok) {
                throw new Error(`API错误: ${response.status}`);
            }
            
            const data = await response.json();
            const aiResponse = data.choices[0].message.content;
            
            // 添加到历史记录
            conversationHistory.push({ role: "assistant", content: aiResponse });
            
            // 显示AI回复
            addMessageToChat('ai', aiResponse);
            
            // 更新状态
            apiStatus.textContent = '● 已响应';
            apiStatus.style.color = '#4CAF50';
            tokenCount.textContent = `Tokens: ${data.usage.total_tokens || 'N/A'}`;
            
        } catch (error) {
            console.error('API调用失败:', error);
            addMessageToChat('ai', `抱歉，出现了错误：${error.message}。请检查你的API密钥或网络连接。`);
            apiStatus.textContent = '● 连接错误';
            apiStatus.style.color = '#f44336';
        } finally {
            showLoading(false);
        }
    }
    
    // 添加消息到聊天界面
    function addMessageToChat(sender, message) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}-message`;
        messageDiv.style.cssText = sender === 'user' 
            ? 'background: var(--gradient); color: white; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 80%; align-self: flex-end;'
            : 'background: #f0f7ff; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 80%;';
        
        messageDiv.innerHTML = `<strong>${sender === 'user' ? '你' : 'AI助手'}：</strong>${message}`;
        chatMessages.appendChild(messageDiv);
        
        // 滚动到底部
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    // 显示/隐藏加载状态
    function showLoading(show) {
        const loadingIndicator = document.getElementById('loading-indicator');
        if (show) {
            if (!loadingIndicator) {
                const loadingDiv = document.createElement('div');
                loadingDiv.id = 'loading-indicator';
                loadingDiv.innerHTML = '<strong>AI助手：</strong><span class="loading-dots">正在思考</span>';
                loadingDiv.style.cssText = 'background: #f0f7ff; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 80%;';
                chatMessages.appendChild(loadingDiv);
                
                // 添加动态点
                const dots = loadingDiv.querySelector('.loading-dots');
                let dotCount = 0;
                const dotInterval = setInterval(() => {
                    dotCount = (dotCount + 1) % 4;
                    dots.textContent = '正在思考' + '.'.repeat(dotCount);
                }, 500);
                
                loadingDiv.dataset.interval = dotInterval;
            }
        } else {
            if (loadingIndicator) {
                clearInterval(loadingIndicator.dataset.interval);
                loadingIndicator.remove();
            }
        }
    }
    
    // 清空聊天记录
    function clearChat() {
        conversationHistory = [
            {
                role: "system",
                content: "你是一个专业的电脑科技助手，名叫'牢大说电脑AI助手'。你帮助用户解答电脑配置、硬件选购、软件使用、系统优化、游戏运行等问题。回答要专业、详细、实用，语气友好热情。"
            }
        ];
        
        // 清空聊天界面，只保留第一条欢迎消息
        chatMessages.innerHTML = `
            <div class="message ai-message" style="background: #f0f7ff; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 80%;">
                <strong>AI助手：</strong>你好！我是DeepSeek AI助手，可以帮你解答电脑配置、软件使用、科技问题等。有什么可以帮你的吗？
            </div>
        `;
        
        apiStatus.textContent = '● 已重置';
        apiStatus.style.color = '#9C27B0';
        tokenCount.textContent = 'Tokens: 0';
    }
    
    // 事件监听器
    sendButton.addEventListener('click', sendMessage);
    clearButton.addEventListener('click', clearChat);
    
    chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    // 初始化API状态
    apiStatus.textContent = '● 已连接';
    apiStatus.style.color = '#4CAF50';
});
</script>
