# .github/workflows/deepseek-api.yml
name: DeepSeek API Proxy

on:
  workflow_dispatch:  # 手动触发
  repository_dispatch:  # 接收外部请求

jobs:
  handle-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install flask requests
        
      - name: Run API server
        run: |
          cd scripts
          python deepseek_api.py
